# Copy to docker-compose.override.yml(gitignored), Docker Compose will merge them
# Makes Python Garmin bridge Docker container available to local network on :9002 so dev PC with Visual Studio / Rider can use it
#
#   copy docker-compose.override.example.yml docker-compose.override.yml
#   docker compose --profile garmin up -d db garmin_bridge
#
# Skip override even if the file exists: docker compose -f docker-compose.yml up

services:
  garmin_bridge:
    ports:
      - "9002:9002"
    environment:
      # Same string as GarminBridge:ApiKey in appsettings.Development.json
      GARMIN_BRIDGE_API_KEY: DefaultDemoPlaceholderApiKeyForGarminBridge
