services:
  db:
    image: postgres:16
    container_name: lifetracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: lifetracker
    ports:
      - "5432:5432"
    volumes:
      - lifetracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  garmin_bridge:
    build:
      context: ./Bridges/garmin_bridge
      dockerfile: Dockerfile
    container_name: lifetracker-garmin-bridge
    ports:
      - "9002:9002"
    env_file:
      - ./Bridges/garmin_bridge/.env
    environment:        # auth token
      GARMIN_TOKEN_DIR: /data/garminconnect 
    volumes:
      - garmin_tokens:/data/garminconnect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/garmin/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifetracker-api
    ports:
      - "5071:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=lifetracker;Username=postgres;Password=mysecretpassword
      APIs__GarminConnect: http://garmin_bridge:9002/garmin/
    depends_on:
      db:
        condition: service_healthy
      garmin_bridge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lifetracker_pgdata:
  garmin_tokens: