name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LifeTracker.slnx

      - name: Build
        run: dotnet build LifeTracker.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test LifeTracker.slnx --no-build --configuration Release --verbosity normal

  deploy-container:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          repository: 0xNullVOID0/LifeTracker-Frontend
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Verify frontend checkout
        run: test -f frontend/package.json && test -f frontend/package-lock.json

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: lifetrackeracr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./LifeTracker/Dockerfile
          push: true
          tags: |
            lifetrackeracr.azurecr.io/lifetracker-api:latest
            lifetrackeracr.azurecr.io/lifetracker-api:${{ github.sha }}

      - name: Restart Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lifetracker'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'lifetrackeracr.azurecr.io/lifetracker-api:${{ github.sha }}'